<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category standard, first viewport sketch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; background-color: #FFFFFF; color: #16181B; }
  .hero {
    height: 720px; position: relative; color: #FFFFFF; background-color: #2B2F33;
    background-image: linear-gradient(90deg, rgba(22,24,27,0.92) 0%, rgba(22,24,27,0.55) 55%, rgba(22,24,27,0.2) 100%),
                      linear-gradient(135deg, #59606A 0%, #3A3F45 40%, #7A6F62 70%, #4C5157 100%);
  }
  nav { height: 84px; display: flex; align-items: center; padding: 0 64px; gap: 36px; font-size: 16px; }
  nav .logo { font-family: Garamond, Georgia, serif; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; }
  nav .call { margin-left: auto; background-color: #C9371F; padding: 12px 22px; font-weight: 700; }
  .copy { padding: 120px 64px 0; max-width: 820px; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; }
  .lede { margin-top: 24px; font-size: 20px; line-height: 1.55; max-width: 600px; }
  .btns { margin-top: 36px; display: flex; gap: 14px; }
  .btns span { padding: 18px 28px; font-weight: 700; font-size: 18px; }
  .btns .a { background-color: #C9371F; }
  .btns .b { background-color: #2B2F33; box-shadow: inset 0 0 0 2px #FFFFFF; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 40px 64px; }
  .tile { height: 120px; background-color: #F2F3F4; display: flex; align-items: center; gap: 16px; padding: 0 24px; font-weight: 700; font-size: 22px; }
  .tile i { width: 48px; height: 48px; background-color: #C9371F; display: block; }
</style>
</head>
<body>
  <div class="hero">
    <nav><span class="logo">METAL WERX</span><span>What we buy</span><span>Services</span><span>Blog</span><span>About</span><span>Contact</span><span class="call">Call 0470 131 025</span></nav>
    <div class="copy">
      <h1>Turn Your Scrap Metal Into Cash</h1>
      <p class="lede">We buy ferrous and non-ferrous metals, car bodies and batteries. Bring your scrap to the yard, hire a bin, or book a pickup.</p>
      <div class="btns"><span class="a">Get a quote</span><span class="b">What we buy</span></div>
    </div>
  </div>
  <div class="row">
    <div class="tile"><i></i>Bin hire</div>
    <div class="tile"><i></i>Pickup</div>
    <div class="tile"><i></i>Commercial</div>
    <div class="tile"><i></i>Cars</div>
  </div>
</body>
</html>
