<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 60 400 400">
  <!-- An illustrated avatar for Mahdi Amiri, drawn by AI. It isn't a likeness:
       swap in a real photo once there is one. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C50000"/>
      <stop offset="1" stop-color="#4A0808"/>
    </linearGradient>
    <clipPath id="vest">
      <path d="M75 500C78 450 100 415 135 393L158 386C168 420 180 460 192 500Z"/>
      <path d="M325 500C322 450 300 415 265 393L242 386C232 420 220 460 208 500Z"/>
    </clipPath>
  </defs>

  <rect y="0" width="400" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="235" r="150" fill="url(#disc)"/>
  <circle cx="200" cy="235" r="150" fill="none" stroke="#FF4040" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Neck -->
  <path d="M168 290V365C180 385 220 385 232 365V290Z" fill="#A9714D"/>
  <path d="M168 296C182 330 218 330 232 296V318C220 342 180 342 168 318Z" fill="#8E5A3B"/>

  <g transform="translate(0 -25)">
    <!-- Charcoal work shirt -->
    <path d="M30 500C30 430 80 398 155 382C170 400 230 400 245 382C320 398 370 430 370 500Z" fill="#363636"/>
    <path d="M155 382C170 400 230 400 245 382" fill="none" stroke="#4A4A4A" stroke-width="6"/>

    <!-- Hi-vis vest with reflective tape -->
    <g clip-path="url(#vest)">
      <rect width="400" height="500" fill="#F26B1D"/>
      <path d="M75 500C78 450 100 415 135 393L158 386" fill="none" stroke="#D45512" stroke-width="10"/>
      <path d="M325 500C322 450 300 415 265 393L242 386" fill="none" stroke="#D45512" stroke-width="10"/>
      <rect y="440" width="400" height="16" fill="#DADADA"/>
      <path d="M140 386L162 500M260 386L238 500" stroke="#DADADA" stroke-width="14"/>
    </g>
  </g>

  <!-- Ears -->
  <ellipse cx="126" cy="232" rx="13" ry="22" fill="#B87A54"/>
  <ellipse cx="274" cy="232" rx="13" ry="22" fill="#B87A54"/>
  <ellipse cx="127" cy="232" rx="6" ry="12" fill="#9A6243"/>
  <ellipse cx="273" cy="232" rx="6" ry="12" fill="#9A6243"/>

  <!-- Face, with a soft shadow down one side -->
  <path d="M125 215C125 145 160 118 200 118C240 118 275 145 275 215C275 275 248 318 200 322C152 318 125 275 125 215Z" fill="#C98B66"/>
  <path d="M248 140C268 160 275 185 275 215C275 275 248 318 200 322C236 300 256 262 256 214C256 180 252 158 248 140Z" fill="#B87A54" opacity="0.7"/>

  <!-- Short hair -->
  <path d="M121 228C112 150 150 104 205 106C258 108 290 150 279 228C274 200 268 180 256 166C230 178 176 176 150 162C136 178 128 200 121 228Z" fill="#1E1915"/>

  <!-- Trimmed beard -->
  <path d="M126 230C128 288 156 332 200 336C244 332 272 288 274 230L262 232C258 262 248 272 230 270C216 264 184 264 170 270C152 272 142 262 138 232Z" fill="#241C17"/>

  <!-- Eyebrows, eyes, nose and smile -->
  <path d="M154 206Q170 197 186 204M214 204Q230 197 246 206" fill="none" stroke="#1E1915" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="170" cy="228" rx="6.5" ry="7.5" fill="#1A1210"/>
  <ellipse cx="230" cy="228" rx="6.5" ry="7.5" fill="#1A1210"/>
  <circle cx="172.5" cy="225.5" r="2" fill="#FFFFFF"/>
  <circle cx="232.5" cy="225.5" r="2" fill="#FFFFFF"/>
  <path d="M199 236L192 260Q200 267 210 261" fill="none" stroke="#9A6243" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 287Q200 307 220 287Q200 295 180 287Z" fill="#F4EDE6" stroke="#7A3B2E" stroke-width="4" stroke-linejoin="round"/>
</svg>
